  water_bath:
    leq: LEQ:0000117
  heating_block:
    leq: LEQ:0000118

# ---------------------------------------------------------------------------
# 3. Context-role binding: computable-lab `context-role` records (and
#    Protocol.roles.contextRoles) -> LWO/LEQ classes. A context role is a
#    semantic slot (e.g. "assay-plate", "positive-control"); its
#    applicable labware/equipment is constrained by the LWO/LEQ class.
# ---------------------------------------------------------------------------
context_role_to_class:
  assay-plate:
    lwo: LWO:0000128          # assay plate
  pcr-plate:
    lwo: LWO:0000127
  deep-well-plate:
    lwo: LWO:0000130
  filter-plate:
    lwo: LWO:0000129
  tc-plate:
    lwo: LWO:0000131
  reagent-reservoir:
    lwo: LWO:0000117
  tip-rack:
    lwo: LWO:0000145
  waste-container:
    lwo: LWO:0000119
  microcentrifuge-tube-rack:
    lwo: LWO:0000151
  conical-tube-rack:
    lwo: LWO:0000151
  plate-lid:
    lwo: LWO:0000161
  pcr-seal:
    lwo: LWO:0000162
  positive-control:
    lwo: null                 # role is semantic; labware class set per-run
    leq: null
    note: >
      Positive control is a biological/context concept, not a labware class.
      LWO/LEQ constrain WHICH plate/tube it lives in, not the control itself.
  vehicle-control:
    lwo: null
    leq: null
  qpcr-run:
    leq: LEQ:0000106          # requires a thermal cycler
  pcr-amplification:
    leq: LEQ:0000106
  centrifugation:
    leq: LEQ:0000107
  cell-culture:
    leq: LEQ:0000110          # CO2 incubator
  nucleic-acid-extraction:
    leq: LEQ:0000171
  sequencing:
    leq: LEQ:0000166

# ---------------------------------------------------------------------------
# Property mapping: computable-lab Labware.format / data -> LWO data props.
# These let computable-lab surface LWO-typed properties in the UI.
# ---------------------------------------------------------------------------
property_mapping:
  well_count: LWO:0000003
  well_depth: LWO:0000009
  well_pitch: LWO:0000008
  nominal_volume: LWO:0000001
  working_volume: LWO:0000002
  bottom_geometry: LWO:0000004
  material: LWO:0000005
  sterility: LWO:0000006
  surface_treatment: LWO:0000007
  skirt_type: LWO:0000010
